# Справочник методов JDK и библиотек для анализа потока данных (правила jr:323 - jr:330).
# Методы записаны именами без классов, через запятую. Свой файл с дополнениями задается настройкой
# zond.flow.library: его записи добавляются к этим.

# После вызова аргумент точно не null: метод бросает исключение, если получил null.
# Objects.requireNonNull(x), Assert.notNull(x, "..."), Preconditions.checkNotNull(x), Validate.notBlank(x)
asserts-not-null=requireNonNull, requireNonNullElse, notNull, checkNotNull, hasText, hasLength, notEmpty, \
  notBlank, isNotNull, checkArgumentNotNull, assertNotNull

# Метод-проверка возвращает true для null: если он вернул false, значение не null.
# Objects.isNull(x), StringUtils.isBlank(x), CollectionUtils.isEmpty(x), Strings.isNullOrEmpty(x)
true-for-null=isNull, isEmpty, isBlank, isNullOrEmpty, isNullOrBlank, isAllBlank, isAnyBlank

# Метод-проверка возвращает false для null: если он вернул true, значение не null.
# Objects.nonNull(x), StringUtils.hasText(x), CollectionUtils.isNotEmpty(x)
false-for-null=nonNull, isNotEmpty, isNotBlank, hasText, hasLength, isNotNull, isNoneBlank, isNumeric, isAlpha

# Метод не возвращает управление: код после него не выполняется.
never-returns=exit, fail, halt

# После вызова в коллекции есть хотя бы один элемент.
adds-element=add, addFirst, addLast, put, putIfAbsent, push, offer, offerFirst, offerLast, addElement

# Метод только читает объект: то, что о нем известно, после вызова остается в силе.
# Записаны начала имен. После любого другого метода о состоянии объекта ничего не известно.
query-prefixes=get, is, has, contains, size, length, stream, parallelStream, equals, hashCode, toString, \
  find, indexOf, lastIndexOf, startsWith, endsWith, matches, compareTo, name, ordinal, values, keySet, \
  entrySet, iterator, peek, element, first, last, count, anyMatch, allMatch, noneMatch, orElse, ifPresent, \
  map, filter, forEach, toArray, subList, copyOf, charAt, substring, trim, strip, split, intValue, longValue

# Типы-коллекции: созданные конструктором без аргументов, они пусты.
collections=ArrayList, LinkedList, HashMap, LinkedHashMap, TreeMap, HashSet, LinkedHashSet, TreeSet, \
  ArrayDeque, PriorityQueue, Stack, Vector, ConcurrentHashMap, CopyOnWriteArrayList, EnumMap, IdentityHashMap, \
  ConcurrentLinkedQueue, ConcurrentLinkedDeque, LinkedBlockingQueue, StringBuilder

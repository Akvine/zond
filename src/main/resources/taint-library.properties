# Справочник для отслеживания данных извне (правила о SQL, путях к файлам, командах, выводе в ответ, логах и других).
# Имена записаны без пакетов, через запятую. Свой файл с дополнениями задается настройкой zond.taint.library:
# его записи добавляются к этим.

# Методы, результат которых - данные запроса у любого объекта: request.getParameter("name")
request-methods=getParameter, getHeader, getOriginalFilename, getQueryString, getPathInfo

# Методы запроса сервлета: источник только у объекта такого типа (или переменной request / req), потому что
# getHeaders, getInputStream есть и у других классов
servlet-request-methods=getParameterValues, getParameterMap, getParameterNames, getHeaders, getHeaderNames, \
  getCookies, getReader, getInputStream, getParts, getPart
servlet-request-types=HttpServletRequest, ServletRequest, HttpServletRequestWrapper, MultipartHttpServletRequest, \
  StaplerRequest, StaplerRequest2

# Аннотации параметра обработчика, значение которого берется из запроса: Spring MVC и JAX-RS
request-annotations=RequestParam, PathVariable, RequestHeader, RequestPart, CookieValue, MatrixVariable, \
  QueryParam, PathParam, FormParam, HeaderParam, CookieParam, MatrixParam
# Объект, собранный из запроса целиком
body-annotations=RequestBody, ModelAttribute, BeanParam
# Метод ресурса JAX-RS: параметр без аннотаций - тело запроса
jax-rs-body-methods=POST, PUT, PATCH, DELETE
# Обработчик Spring: строковый параметр без аннотаций берется из параметров запроса по имени
mapping-annotations=RequestMapping, GetMapping, PostMapping, PutMapping, DeleteMapping, PatchMapping
# Методы, которые получают сообщения из очереди
listener-annotations=KafkaListener, KafkaHandler, RabbitListener, RabbitHandler, JmsListener, SqsListener, \
  StreamListener, PulsarListener, MessageMapping, ServiceActivator

# Содержимое загруженного файла: file.getBytes() у MultipartFile
file-types=MultipartFile, Part, FilePart
file-content-methods=getBytes, getInputStream, getResource

# Ответ другого сервиса
external-calls=getForObject, getForEntity, postForObject, postForEntity, patchForObject, bodyToMono, bodyToFlux
http-client-types=RestTemplate, RestOperations, RestClient, WebClient

# Значение такого типа не несет ни пути, ни адреса, ни куска запроса
safe-types=int, long, short, byte, double, float, boolean, char, Integer, Long, Short, Byte, Double, Float, \
  Boolean, Character, BigDecimal, BigInteger, UUID, LocalDate, LocalDateTime, LocalTime, Instant, ZonedDateTime, \
  OffsetDateTime, Duration

# Приведение к числу, UUID или enum: если значение не подошло, будет исключение, а не инъекция
converters=parseInt, parseLong, parseDouble, parseFloat, parseShort, parseByte, parseBoolean, fromString, \
  parseUnsignedInt, parseUnsignedLong

# Проверки в условии: по списку допустимых, по шаблону, сравнением с константой
validation-methods=contains, containsKey, matches, equals, equalsIgnoreCase, isValid, isAllowed

# Методы, результат которых собран из аргументов: String.format("%s", name), Paths.get(dir, name)
passing-methods=format, formatted, concat, join, valueOf, append, replace, replaceAll, toString, of, get, \
  resolve, decode, requireNonNull, orElse, getOrDefault

# Слова в имени метода очистки: после encodeForHtml(...), sanitize(...), normalize(...) значение обезврежено
sanitizer-words=encode, escape, sanitize, normalize, cleanPath, canonical, validate, whitelist, allowed
# Base64 и hex не обезвреживают: decodeBase64(encodeBase64(name)) вернет значение как было
reversible-encoding-words=base64, hex, encodeToString
# Экранирование для HTML защищает только вывод в ответ, для SQL - только запрос к базе
html-escape-words=html, xml, javascript, css, xss
sql-escape-words=sql
